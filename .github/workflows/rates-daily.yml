name: rates-daily

# 금리 대시보드 일별 데이터 자동 갱신 — 매 평일 아침 07:30 KST (22:30 UTC 전일)
# 국고채 3/10년·CD 91일·원/달러(네이버금융), 미 국채 2/10년(FRED) 수집 →
# rates_data.js / data_master.json 갱신 커밋 → GitHub Pages 자동 반영
on:
  schedule:
    - cron: "30 22 * * 0-4"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency: rates-daily

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch daily rates
        run: python fetch_rates.py

      - name: Commit & push if changed
        run: |
          git config user.name "rates-bot"
          git config user.email "actions@users.noreply.github.com"
          git add rates_data.js data_master.json
          if git diff --cached --quiet; then
            echo "변경 없음 — 커밋 생략"
          else
            git commit -m "rates: daily update $(TZ=Asia/Seoul date +%F)"
            git push
          fi
