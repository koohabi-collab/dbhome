const un = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
document.getElementById('f').addEventListener('submit', async e => {
  e.preventDefault();
  const err = document.getElementById('err');
  err.textContent = '확인 중…';
  try {
    const pw = document.getElementById('pw').value;
    const km = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey(
      {name:'PBKDF2', salt:un(SALT), iterations:ITER, hash:'SHA-256'},
      km, {name:'AES-GCM', length:256}, false, ['decrypt']);
    const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:un(IV)}, key, un(CT));
    const html = new TextDecoder().decode(pt);
    try{sessionStorage.setItem('dash_pw', pw);}catch(_){}
    document.open(); document.write(html); document.close();
  } catch (ex) {
    err.textContent = '비밀번호가 올바르지 않습니다';
  }
});


/* 세션 자동잠금해제 — 같은 탭 안에서는 비밀번호 재입력 불필요 */
(async () => { try {
  const sp = sessionStorage.getItem('dash_pw'); if (!sp) return;
  const km = await crypto.subtle.importKey('raw', new TextEncoder().encode(sp), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({name:'PBKDF2', salt:un(SALT), iterations:ITER, hash:'SHA-256'},
    km, {name:'AES-GCM', length:256}, false, ['decrypt']);
  const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:un(IV)}, key, un(CT));
  document.open(); document.write(new TextDecoder().decode(pt)); document.close();
} catch (e) { try{sessionStorage.removeItem('dash_pw');}catch(_){} } })();

/* 새 버전 자동 감지 — 캐시된 옛 페이지가 열리면 서버의 BUILD_ID와 비교해 스스로 새로고침.
   덕분에 사용자는 항상 같은 주소만 쓰면 된다 (?v= 캐시 우회 불필요). */
const BUILD_ID = 'e5ce9d6725a9';
(async () => {
  try {
    const r = await fetch(location.pathname, {cache: 'no-store', headers: {'Range': 'bytes=0-2047'}});
    const head = (await r.text()).slice(0, 4000);
    const m = head.match(/BUILD_ID=([0-9a-f]+)/);
    if (m && m[1] !== BUILD_ID) {
      if (!document.getElementById('pw').value) {
        location.replace(location.pathname + '?u=' + Date.now());
      } else {
        document.getElementById('err').textContent = '새 버전이 있습니다 — 새로고침 해주세요';
      }
    }
  } catch (e) {}
})();
